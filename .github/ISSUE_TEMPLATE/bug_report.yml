name: Bug report
description: Something in Bloom doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: file-type
    attributes:
      label: File type
      description: For example "HEIC photo" or "MOV video from iPhone".
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Run `sw_vers -productVersion` in Terminal.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error message or screenshot

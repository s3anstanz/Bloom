name: Bug report
description: Something in Bloom doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Report a Problem…** in Bloom's menu opens this form with a few fields filled in. GitHub receives those fields when the page opens; review and change them before you submit."
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: file-type
    attributes:
      label: File type
      description: For example "HEIC photo" or "MOV video from iPhone".
  - type: textarea
    id: output
    attributes:
      label: Error message or screenshot
  - type: input
    id: bloom
    attributes:
      label: Bloom version
      description: At the bottom of Bloom's menu.
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Apple menu › About This Mac. For example "15.4".
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac
      description: The chip, from Apple menu › About This Mac. For example "Apple M2".

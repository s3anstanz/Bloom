name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    uses: ./.github/workflows/test-plan.yml

  build-test:
    name: Build, test and package${{ matrix.os != 'macos-15' && format(' on {0}', matrix.os) || '' }}
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        # macOS 26 is Tahoe, the newest macOS people run Bloom on.
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Formatting
        # swift-format's output can differ between toolchains, so one runner checks it.
        if: matrix.os == 'macos-15'
        run: |
          scripts/format.sh
          if ! git diff --exit-code; then
            echo "::error::Code isn't formatted. Run scripts/format.sh and commit; the diff above shows the changes."
            exit 1
          fi

      - name: No networking in BloomCore
        run: scripts/check-no-network.sh

      - name: Build with warnings as errors
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test

      - name: Backtrace of a test crash
        if: failure()
        run: |
          lldb --batch \
            -o "process handle SIGPIPE --notify false --pass true --stop false" \
            -o run \
            -k "thread backtrace all" \
            -k quit \
            -- "$(xcrun --find xctest)" .build/debug/BloomPackageTests.xctest

      - name: Package Bloom.app
        run: |
          scripts/bundle.sh release build/Bloom.app
          ditto -c -k --keepParent build/Bloom.app build/Bloom.zip

      - name: Upload Bloom.app
        if: matrix.os == 'macos-15'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Bloom
          path: build/Bloom.zip
          if-no-files-found: error
          retention-days: 14

  # The one check to require before merging: it passes when every job this change needed passed.
  result:
    name: CI result
    needs: [plan, build-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job this change needed passed
        env:
          RESULTS: ${{ needs.plan.result }} ${{ needs.build-test.result }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::A job ended $result." && exit 1 ;;
            esac
          done

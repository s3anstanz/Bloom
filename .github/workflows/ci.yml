name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test and package
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Formatting
        run: |
          scripts/format.sh
          if ! git diff --exit-code; then
            echo "::error::Code isn't formatted. Run scripts/format.sh and commit; the diff above shows the changes."
            exit 1
          fi

      - name: No networking in BloomCore
        run: scripts/check-no-network.sh

      - name: Build with warnings as errors
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test
        env:
          SWIFT_BACKTRACE: enable=yes,sanitize=no,threads=crashed

      - name: Crash reports
        if: failure()
        run: scripts/print-crash-reports.py

      - name: Package Bloom.app
        run: |
          scripts/bundle.sh release build/Bloom.app
          ditto -c -k --keepParent build/Bloom.app build/Bloom.zip

      - name: Upload Bloom.app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Bloom
          path: build/Bloom.zip
          if-no-files-found: error
          retention-days: 14

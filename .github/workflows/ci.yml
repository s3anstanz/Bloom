name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/change-scope.yml

  macos:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: macOS build, test and package
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Formatting
        run: |
          scripts/format.sh
          if ! git diff --exit-code; then
            echo "::error::Code isn't formatted. Run scripts/format.sh and commit; the diff above shows the changes."
            exit 1
          fi

      - name: No networking in BloomCore
        run: scripts/check-no-network.sh

      - name: Build with warnings as errors
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test

      - name: Package Bloom.app
        run: |
          scripts/bundle.sh release build/Bloom.app
          ditto -c -k --keepParent build/Bloom.app build/Bloom.zip

      - name: Upload Bloom.app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Bloom
          path: build/Bloom.zip
          if-no-files-found: error
          retention-days: 14

  build-test:
    name: Build, test and package
    needs: [changes, macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required checks
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          FULL: ${{ needs.changes.outputs.full }}
          BUILD_RESULT: ${{ needs.macos.result }}
        run: |
          if [[ "$SCOPE_RESULT" != success ]]; then
            echo "Change classification failed; CI cannot be skipped."
            exit 1
          fi
          if [[ "$FULL" == false && "$BUILD_RESULT" == skipped ]]; then
            echo "Routine documentation only: expensive checks skipped."
          elif [[ "$FULL" == true && "$BUILD_RESULT" == success ]]; then
            echo "Required macOS checks passed."
          else
            echo "Required checks did not complete successfully."
            exit 1
          fi

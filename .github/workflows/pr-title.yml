name: PR title

# Checks the title follows Bloom's naming convention (scripts/check-title.sh) and labels the pull request with its
# type and area, replacing the labels an earlier title gave it.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  title:
    name: Title and labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          scripts/check-title.sh "$TITLE" | tee "$RUNNER_TEMP/labels.txt"

      - name: Label the pull request
        # Pull requests from forks and Dependabot get a read-only token, which can't label.
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          wanted="$(cat "$RUNNER_TEMP/labels.txt")"
          current="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')"
          while IFS= read -r label; do
            [ -n "$label" ] || continue
            case "$label" in
              "type: "*) color=C9ADFF ;;
              *) color=8FDEFF ;;
            esac
            gh label create "$label" --repo "$GITHUB_REPOSITORY" --color "$color" 2>/dev/null || true
            if ! grep -qxF "$label" <<<"$current"; then
              gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "$label"
            fi
          done <<<"$wanted"
          while IFS= read -r label; do
            case "$label" in
              "type: "* | "area: "*)
                if ! grep -qxF "$label" <<<"$wanted"; then
                  gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$label"
                fi
                ;;
            esac
          done <<<"$current"

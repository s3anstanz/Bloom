name: PR title

# Checks the title follows Bloom's naming convention (scripts/check-title.sh).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  title:
    # The ruleset on main requires a check by this name.
    name: Title and labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: scripts/check-title.sh "$TITLE"

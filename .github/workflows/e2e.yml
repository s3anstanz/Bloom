name: E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end journeys
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Turn off Reduce Motion and Reduce Transparency
        run: |
          for key in reduceMotion reduceTransparency; do
            defaults write com.apple.universalaccess "$key" -bool false
          done

      - name: Play the journeys
        run: scripts/e2e.sh "$RUNNER_TEMP/e2e"

      - name: Show Bloom crash reports
        if: failure()
        run: |
          shopt -s nullglob
          reports=(~/Library/Logs/DiagnosticReports/Bloom*)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "Bloom didn't crash."
          else
            head -n 120 "${reports[@]}"
          fi

      - name: Publish the screenshots
        # Pull requests from forks and Dependabot get a read-only token, which can't publish.
        if: >-
          always()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/publish-images.sh e2e "$RUNNER_TEMP/e2e"

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore
          retention-days: 14

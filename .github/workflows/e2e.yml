name: E2E

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: End-to-end journeys${{ matrix.os != 'macos-15' && format(' on {0}', matrix.os) || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    concurrency:
      group: e2e-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Turn off Reduce Motion and Reduce Transparency
        run: |
          for key in reduceMotion reduceTransparency; do
            defaults write com.apple.universalaccess "$key" -bool false
          done

      - name: Play the journeys
        run: scripts/e2e.sh "$RUNNER_TEMP/e2e" --matrix

      - name: Show Bloom crash reports
        if: failure()
        run: |
          shopt -s nullglob
          reports=(~/Library/Logs/DiagnosticReports/Bloom*)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "Bloom didn't crash."
          else
            head -n 120 "${reports[@]}"
          fi

      - name: Publish the screenshots
        # Pull requests from forks and Dependabot get a read-only token, which can't publish.
        if: >-
          always()
          && (github.event_name != 'pull_request'
            || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: .github/scripts/publish-images.sh "e2e-${{ matrix.os }}" "$RUNNER_TEMP/e2e"

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots-${{ matrix.os }}
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore
          retention-days: 14

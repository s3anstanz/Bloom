name: Classify changes

on:
  workflow_call:
    outputs:
      full:
        description: Whether full CI is required
        value: ${{ jobs.scope.outputs.full }}

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test classifier
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Classify changes
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
          FORCE: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: python3 .github/scripts/ci_scope.py "$BASE" "$HEAD" "$EVENT" "$FORCE" >> "$GITHUB_OUTPUT"
